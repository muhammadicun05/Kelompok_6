  <style>
    :root {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0E131F;
      color: var(--lembar);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--celup-indigo);
      border-bottom: 2px solid var(--kapur);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .header-title h1 {
      font-size: 16px;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title p {
      font-size: 11px;
      color: #A3B8CC;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: var(--kapur);
    }
    .btn-primary {
      background: var(--kapur);
      color: var(--tinta);
      font-weight: 700;
      border-color: var(--kapur);
    }
    .btn-primary:hover {
      background: #F2ED7F;
    }
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background: #0B0F17;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .viewport:active {
      cursor: grabbing;
    }
    #svgContainer {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      transition: transform 0.05s ease-out;
    }
    svg {
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5));
    }
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(21, 26, 36, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 11px;
      display: flex;
      gap: 16px;
      align-items: center;
      z-index: 5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

  <script>
    let scale = 0.75;
    let translateX = 40;
    let translateY = 20;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const container = document.getElementById("svgContainer");
    const viewport = document.getElementById("viewport");

    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function zoomIn() {
      scale = Math.min(scale * 1.2, 2.5);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(scale / 1.2, 0.3);
      updateTransform();
    }

    function resetZoom() {
      scale = 0.75;
      translateX = 40;
      translateY = 20;
      updateTransform();
    }

    viewport.addEventListener("mousedown", (e) => {
      isDragging = true;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      scale = Math.min(Math.max(scale * zoomFactor, 0.3), 2.5);
      updateTransform();
    }, { passive: false });

    // Initial render
    updateTransform();
  </script>
